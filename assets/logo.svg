<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="docharvest-logo-title">
  <title id="docharvest-logo-title">DocHarvest Logo</title>
  <desc>Stylized layered documentation pages flowing into an electric amber harvest terminal glyph.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Dark Tile -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg-grad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#border-grad)" stroke-width="3"/>

  <!-- Subtle Internal Grid Glow -->
  <circle cx="256" cy="256" r="160" fill="#38bdf8" opacity="0.04" filter="url(#glow)"/>
  <circle cx="360" cy="280" r="100" fill="#f59e0b" opacity="0.05" filter="url(#glow)"/>

  <!-- Left Document Spine / Sheet 1 (Background Offset) -->
  <rect x="96" y="156" width="168" height="216" rx="24" fill="none" stroke="#334155" stroke-width="12" opacity="0.6"/>

  <!-- Primary Foreground Document Sheet -->
  <rect x="124" y="132" width="176" height="236" rx="26" fill="#0c1322" stroke="url(#cyan-indigo)" stroke-width="20"/>

  <!-- Document Line Snippets -->
  <line x1="168" y1="198" x2="236" y2="198" stroke="#38bdf8" stroke-width="16" stroke-linecap="round"/>
  <line x1="168" y1="244" x2="256" y2="244" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <line x1="168" y1="290" x2="220" y2="290" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>

  <!-- Graph Connector Node -->
  <circle cx="256" cy="290" r="8" fill="url(#emerald-glow)"/>

  <!-- Harvest / Terminal Chevron & Spark Prompt -->
  <path d="M312 196 L376 250 L312 304" fill="none" stroke="url(#amber-glow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="400" y1="304" x2="436" y2="304" stroke="url(#amber-glow)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Accent Spark Particle -->
  <circle cx="396" cy="180" r="6" fill="#38bdf8"/>
</svg>
